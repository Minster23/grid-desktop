<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 180" width="70" height="180">
  <defs>
    <!-- Fém rúd színátmenete -->
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5a5a3"/>
      <stop offset="40%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#a5a5a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Kar árnyéka és teste -->
  <g filter="url(#shadow)">
    <!-- Rúd: a bázis közepétől (25,25) lefelé fut enyhe töréssel -->
    <path d="M 23 25 L 23 115 L 35 145" fill="none" stroke="url(#metalArm)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hangszedő fej (headshell) a rúd végén szögben -->
    <rect x="26" y="140" width="16" height="28" rx="4" transform="rotate(-15 35 154)" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
    <!-- Kis fogantyú a fejen -->
    <line x1="42" y1="150" x2="48" y2="152" stroke="#dddddd" stroke-width="2" stroke-linecap="round"/>

    <!-- Forgóbázis (alap) -->
    <circle cx="25" cy="25" r="18" fill="#3a393c" stroke="#5a595c" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="10" fill="#252426"/>
    <circle cx="25" cy="25" r="5" fill="#e0e0e0"/>
  </g>
</svg>
